<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>I'm Sorry 💕</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-12px) rotate(2deg)} }
  @keyframes heartpop { 0%{transform:scale(0) translateY(0);opacity:1} 100%{transform:scale(1.6) translateY(-50px);opacity:0} }
  @keyframes confetti { 0%{transform:translateY(0) rotate(0);opacity:1} 100%{transform:translateY(500px) rotate(720deg);opacity:0} }
  @keyframes forgiven-in { 0%{transform:scale(0.5);opacity:0} 70%{transform:scale(1.08)} 100%{transform:scale(1);opacity:1} }
  @keyframes spin-heart { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
  @keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @keyframes bg-shift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

  * { box-sizing:border-box; margin:0; padding:0; }

  body {
    font-family: 'Nunito', 'Comic Sans MS', cursive, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #fde8f5, #e8f0ff, #fce4ec, #e8f5e9, #fde8f5);
    background-size: 400% 400%;
    animation: bg-shift 8s ease infinite;
    overflow: hidden;
  }

  #wrap {
    width: 100%;
    max-width: 1000px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 32px;
    position: relative;
    overflow: hidden;
  }

  #stars {
    position: fixed;
    top:0; left:0; right:0; bottom:0;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    animation: shimmer 2s ease-in-out infinite;
    color: #f9a8d4;
    user-select: none;
  }

  #main-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  #header {
    font-size: 32px;
    font-weight: 900;
    color: #d45e8a;
    text-align: center;
    margin-bottom: 6px;
    text-shadow: 0 2px 0 #fff8;
  }

  #sub {
    font-size: 16px;
    color: #b07ca0;
    margin-bottom: 28px;
    text-align: center;
    font-weight: 700;
  }

  #cat-wrap {
    position: relative;
    width: 200px;
    height: 200px;
    margin-bottom: 28px;
    cursor: pointer;
    animation: bob 2.8s ease-in-out infinite;
  }

  #cat-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 8px 16px #f48fb166);
  }

  .floating-heart {
    position: absolute;
    font-size: 26px;
    pointer-events: none;
    animation: heartpop 1s ease forwards;
    z-index: 10;
  }

  #btns {
    display: flex;
    gap: 16px;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
    width: 100%;
  }

  #yes-btn {
    background: linear-gradient(135deg, #f06292, #e91e8c);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 14px 36px;
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.2s, box-shadow 0.2s, font-size 0.4s, padding 0.4s;
    box-shadow: 0 4px 0 #c2185b, 0 8px 20px #f4849066;
    flex-shrink: 0;
  }
  #yes-btn:hover { transform: scale(1.08) translateY(-2px); }
  #yes-btn:active { transform: scale(0.96); box-shadow: 0 1px 0 #c2185b; }

  #no-btn {
    background: #f3e5f5;
    color: #ab47bc;
    border: 2px solid #ce93d8;
    border-radius: 50px;
    padding: 12px 32px;
    font-size: 23px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: font-size 0.3s, padding 0.3s, opacity 0.4s, transform 0.1s;
    flex-shrink: 0;
  }
  #no-btn:active { transform: scale(0.95); }

  #gif-footer {
    display: flex;
    justify-content: center;
  }

  #gif-footer img {
    width: 110px;
    border-radius: 20px;
    opacity: 0.88;
    filter: drop-shadow(0 4px 8px #f48fb144);
  }

  #forgiven {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    animation: forgiven-in 0.7s ease forwards;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  #forgiven.show { display: flex; }

  #forgiven .spin-emoji {
    font-size: 90px;
    animation: spin-heart 1.8s linear infinite;
    display: block;
  }

  #forgiven h2 {
    font-size: 30px;
    color: #d81b60;
    font-weight: 900;
  }

  #forgiven p {
    font-size: 22px;
    color: #f3088d;
    line-height: 1.7;
    font-weight: 700;
  }

  #forgiven img {
    width: 250px;
    border-radius: 54px;
    margin-top: 20px;
    filter: drop-shadow(0 6px 16px #f48fb188);
  }

  .confetti-dot {
    position: fixed;
    width: 10px; height: 10px;
    border-radius: 3px;
    pointer-events: none;
    animation: confetti linear forwards;
    z-index: 999;
  }
</style>
</head>
<body>

<audio id="bg-music" loop>
  <source src="Michael Giacchino - Married Life.mp3" type="audio/mp3">
</audio>

<div id="stars"></div>

<div id="wrap">
  <div id="main-content">
    <div id="header">Миний буруу... 🥺</div>
    <div id="sub">Санаами хоёулаа эвлэрье тэгэх үү? Please🙏</div>

    <div id="cat-wrap" title="Click me!">
      <img src="Bugcat Sticker by Capoo.gif" alt="cute fluffy blue cat" id="cat-img" onerror="this.style.fontSize='90px'; this.style.display='flex'; this.style.alignItems='center'; this.style.justifyContent='center'; this.outerHTML='<div style=\'font-size:90px;text-align:center;line-height:200px\'>🐱</div>'"/>
    </div>

    <div id="btns">
      <button id="yes-btn">Тэгье 💖</button>
      <button id="no-btn">Үгүй 😤</button>
    </div>

    <div id="gif-footer">
      <img src="Heart Love Sticker by Capoo.gif" alt="sorry cat" onerror="this.outerHTML='<div style=\'font-size:50px;text-align:center\'>🐱💕</div>'" />
    </div>
  </div>

  <div id="forgiven">
    <span class="spin-emoji">💖</span>
    <h2>Баярлалаа, Хөөрхнөө!! 🎉</h2>
    <p>Одоо хоёулаа муудалцахгүй шүү okay 🥰</p>
    <img src="sticker_8.gif" alt="happy cat" onerror="this.outerHTML='<div style=\'font-size:80px;text-align:center\'>🐱💕</div>'" />
  </div>
</div>

<script>
  const music = document.getElementById('bg-music');
  music.volume = 0.3;

  let audioStarted = false;
  function startAudio() {
    if (!audioStarted) {
      audioStarted = true;
      music.play().catch(() => {});
    }
  }

  ['click', 'touchstart', 'keydown'].forEach(evt =>
    document.addEventListener(evt, startAudio, { once: true })
  );

  const starsEl = document.getElementById('stars');
  for(let i=0;i<16;i++){
    const s=document.createElement('div');
    s.className='star';
    s.textContent=['✦','✧','⋆','✩'][Math.floor(Math.random()*4)];
    s.style.left=Math.random()*98+'%';
    s.style.top=Math.random()*98+'%';
    s.style.animationDelay=Math.random()*2.5+'s';
    s.style.fontSize=(10+Math.random()*14)+'px';
    starsEl.appendChild(s);
  }

  const catWrap = document.getElementById('cat-wrap');
  const yesBtn = document.getElementById('yes-btn');
  const noBtn = document.getElementById('no-btn');
  const main = document.getElementById('main-content');
  const forgiven = document.getElementById('forgiven');

  catWrap.addEventListener('click', spawnHeart);

  function spawnHeart(){
    const h=document.createElement('div');
    h.className='floating-heart';
    h.textContent=['💖','💗','💕','💞','🩷','💓'][Math.floor(Math.random()*6)];
    h.style.left=(20+Math.random()*60)+'%';
    h.style.top=(15+Math.random()*35)+'%';
    catWrap.appendChild(h);
    setTimeout(()=>h.remove(),1000);
  }

  let noClicks=0;
  const noPhrases=['Гуйж байна шдээ... 😤','Дахиад нэг бодооч... 😒','Үгүй гэвэл би үнэхээр их гуниглана шүү😑','Маш их гуниглан шүү 🙅','Маш маш их гуниглан шүү 😤','За маяглаад байгаарай!!!😒'];

  noBtn.addEventListener('click',()=>{
    noClicks++;
    noBtn.textContent=noPhrases[Math.min(noClicks,noPhrases.length-1)];

    const sz=Math.max(11,17-noClicks*1.4);
    const pd=Math.max(6,32-noClicks*3);
    noBtn.style.fontSize=sz+'px';
    noBtn.style.padding=Math.max(5,12-noClicks)+'px '+pd+'px';

    const ysz=Math.min(60,22+noClicks*8);
    const ypd=Math.min(72,44+noClicks*10);
    yesBtn.style.fontSize=ysz+'px';
    yesBtn.style.padding='14px '+ypd+'px';

    spawnHeart();

    if(noClicks>=6){
      noBtn.style.opacity='0.2';
      noBtn.style.pointerEvents='none';
    }
  });

  yesBtn.addEventListener('click',()=>{
    main.style.display='none';
    forgiven.classList.add('show');
    launchConfetti();
    for(let i=0;i<6;i++) setTimeout(spawnHeart,i*180);
  });

  function launchConfetti(){
    const colors=['#f48fb1','#ce93d8','#90caf9','#a5d6a7','#fff176','#ffcc80','#ff8fab','#b5ead7'];
    for(let i=0;i<70;i++){
      setTimeout(()=>{
        const c=document.createElement('div');
        c.className='confetti-dot';
        c.style.background=colors[Math.floor(Math.random()*colors.length)];
        c.style.left=Math.random()*100+'vw';
        c.style.top='-20px';
        c.style.width=(7+Math.random()*8)+'px';
        c.style.height=(7+Math.random()*8)+'px';
        c.style.animationDuration=(1.5+Math.random()*2.5)+'s';
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),4500);
      },i*55);
    }
  }
</script>
</body>
</html>
